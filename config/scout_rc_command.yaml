scout_rc_command_estimator:
  ros__parameters:
    # Fits from the 2026-10-24 RC vs chassis feedback calibration:
    # left vertical -> linear 0.01287 m/s/raw (r=0.994), right horizontal
    # -> angular -0.00489 rad/s/raw (r=-0.997). These are estimates of
    # remote commands, not the firmware's undisclosed setpoints.
    max_linear_mps: 1.29
    max_angular_radps: 0.49
    stick_full_scale: 100.0
    deadzone_raw: 3.0
    linear_sign: 1.0
    angular_sign: -1.0
    status_timeout_s: 0.5
    rc_mode_value: 3
